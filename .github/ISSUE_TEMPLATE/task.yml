name: Task
description: One unit of work for an agent or a person
title: "T<id>: "
body:
  - type: textarea
    id: goal
    attributes: { label: Goal, description: "What this ticket delivers, in a sentence or two." }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, value: "- [ ] " }
    validations: { required: true }
  - type: textarea
    id: files
    attributes: { label: Files touched, description: "Only these files should change." }
    validations: { required: true }
  - type: input
    id: test
    attributes: { label: Test command, placeholder: "uv run pytest tests/unit/test_rules.py" }
  - type: input
    id: deps
    attributes: { label: Depends on, placeholder: "#12 (T1.1), #13 (T0.2) or none" }
  - type: textarea
    id: out
    attributes: { label: Out of scope }
  - type: textarea
    id: notes
    attributes: { label: Notes }
